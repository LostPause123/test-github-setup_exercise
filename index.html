<html>
    <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test page</title>
<style>
  :root {
    --bg: #f4f6f9;
    --panel: #ffffff;
    --text: #1b2430;
    --muted: #5b6675;
    --line: #d9dee6;
    --accent: #2557d6;
    --accent-text: #ffffff;
    --ok: #1a7f4b;
    --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c;
      --panel: #1a2029;
      --text: #e6eaf0;
      --muted: #98a3b3;
      --line: #2b3441;
      --accent: #7da2ff;
      --accent-text: #0e1420;
      --ok: #5fd39a;
      --bad: #ff8a80;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  main {
    width: 100%;
    max-width: 34rem;
    padding: 28px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
  }

  h1 { margin: 0 0 4px; font-size: 1.6rem; letter-spacing: -0.01em; }
  h2 { margin: 28px 0 8px; font-size: 1rem; }
  .lead { margin: 0; color: var(--muted); }

  .checks { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .checks li {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .status { font-weight: 600; }
  .status.ok { color: var(--ok); }
  .status.bad { color: var(--bad); }

  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  button {
    padding: 8px 16px;
    font: inherit;
    font-weight: 600;
    color: var(--accent-text);
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  button:active { transform: translateY(1px); }

  input {
    width: 100%;
    padding: 8px 12px;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
  }

  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .echo { margin: 8px 0 0; color: var(--muted); min-height: 1.55em; }
  .probe { color: rgb(1, 2, 3); position: absolute; left: -9999px; }
</style>
</head>
<body>
  <main>
    <h1>Test page</h1>
    <p class="lead">If you can read this, the file opened correctly.</p>

    <h2>Checks</h2>
    <ul class="checks">
      <li><span>HTML renders</span><span class="status ok">Working</span></li>
      <li><span>CSS loaded</span><span class="status bad" id="css-status">Not detected</span></li>
      <li><span>JavaScript running</span><span class="status bad" id="js-status">Not running</span></li>
    </ul>

    <h2>Click counter</h2>
    <div class="row">
      <button type="button" id="add">Add one</button>
      <span id="count">Clicks: 0</span>
    </div>

    <h2>Text echo</h2>
    <label for="name" class="lead">Type something below</label>
    <input id="name" type="text" autocomplete="off">
    <p class="echo" id="echo"></p>

    <h2>Loaded</h2>
    <p class="lead" id="time"></p>
    <span class="probe" id="probe"></span>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    const cssOk = getComputedStyle($("probe")).color === "rgb(1, 2, 3)";
    $("css-status").textContent = cssOk ? "Working" : "Not detected";
    $("css-status").className = "status " + (cssOk ? "ok" : "bad");

    $("js-status").textContent = "Working";
    $("js-status").className = "status ok";

    let clicks = 0;
    $("add").addEventListener("click", () => {
      clicks += 1;
      $("count").textContent = "Clicks: " + clicks;
    });

    $("name").addEventListener("input", (e) => {
      $("echo").textContent = e.target.value ? "You typed: " + e.target.value : "";
    });

    $("time").textContent = new Date().toLocaleString();
  </script>
</body>
</html>
